[package]
name = "rv-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
publish = false

[features]
# Verify HTTPS alongside RV's existing OpenSSL/rustls implementations.
openssl-compat = ["dep:openssl", "dep:tokio-openssl", "dep:rustls"]

[dependencies]
meow-common = { git = "https://github.com/gitssie/meow-rs", rev = "317fa9df484264820368ffca559ed8fcc7188765", default-features = false }
meow-proxy = { git = "https://github.com/gitssie/meow-rs", rev = "317fa9df484264820368ffca559ed8fcc7188765", default-features = false }
tokio.workspace = true
base64 = "0.22"
http = "1"
httparse = "1"
async-trait = "0.1"

openssl = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
