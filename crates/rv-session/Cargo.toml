[package]
name = "rv-session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tokio RFB session, framebuffer compositor, and VeNCrypt for RV"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
zxtouch.workspace = true
rv-core.workspace = true
rv-automation.workspace = true
image.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
vnc.workspace = true
webpki-roots.workspace = true
openssl.workspace = true
tokio-openssl.workspace = true
zeroize = "1"
regex = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3"
mailparse = "0.18"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json.workspace = true
serde.workspace = true
base64 = "0.22"
plist = "1.7.1"
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
flate2 = "1"

[dev-dependencies]
tracing-subscriber.workspace = true
h2 = "0.4"
tempfile = "3"
openssl.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[dev-dependencies.hyper]
version = "1"
features = ["server", "http2"]
[dev-dependencies.hyper-util]
version = "0.1"
features = ["tokio"]
[dev-dependencies.http-body-util]
version = "0.1"
