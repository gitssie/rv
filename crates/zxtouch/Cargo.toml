[package]
name = "zxtouch"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
description = "Authenticated HTTP/2 client for TrollVNC ZXTouch services"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
http = "1"
h2 = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
